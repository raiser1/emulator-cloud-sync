# ============================================================================
#  emulator-cloud-sync  —  device profile & emulator map
# ----------------------------------------------------------------------------
#  This file is SOURCED by `ecs`. It is the ONLY file you normally edit.
#  Everything here is plain key/value pairs. No programming needed.
#
#  Colon ( : ) separates multiple paths in one field. Android paths never
#  contain a colon, so this is safe.
# ============================================================================


# ---------------------------------------------------------------------------
# 1) WHICH CLOUD?  This is the rclone "remote" name you created during setup.
#    Use "gdrive" for Google Drive or "onedrive" for OneDrive. You can even
#    override it per-emulator below with the `remote` field.
# ---------------------------------------------------------------------------
CLOUD_REMOTE="gdrive"

# Base folder created inside that cloud. Everything lives under here.
CLOUD_BASE="EmulatorSync"

# ---------------------------------------------------------------------------
# 2) DOES THIS DEVICE HAVE ROOT?  Set per-DEVICE (copy this file to each
#    device and set this line). 1 = rooted, 0 = not rooted.
#    On a non-rooted device, profiles marked `root 1` are automatically
#    skipped with a clear message instead of failing.
# ---------------------------------------------------------------------------
DEVICE_ROOTED=0

# Where root profiles stage files so Termux can reach them (rooted devices).
STAGING="$HOME/.ecs/staging"


# ===========================================================================
#  EMULATOR PROFILES
#  ---------------------------------------------------------------------------
#  profile <key> \
#     label        "<human name>" \
#     root         <0|1>          # 1 = files live in Android/data, needs root
#     pkg          "<android.package.name>"     # for root staging
#     saves        "<local save path>[:<path2>...]" \
#     config       "<local config path>[:...]"  \
#     roms_local   "<where ROMs live / should be cached on device>" \
#     roms_remote  "<subfolder under CLOUD_BASE for ROMs>" \
#     saves_remote "<subfolder under CLOUD_BASE for saves+config>"
#
#  IMPORTANT: paths below are sensible DEFAULTS. Versions differ. After setup
#  run `ecs list` — it marks each path ✓ (exists) or ✗ (missing) so you can
#  correct anything here before your first sync.
# ===========================================================================


# ---- PPSSPP (PSP) — fully public, works with NO root -----------------------
profile ppsspp \
  label        "PPSSPP (PSP)" \
  root         0 \
  pkg          "org.ppsspp.ppsspp" \
  saves        "/storage/emulated/0/PSP/SAVEDATA:/storage/emulated/0/PSP/PPSSPP_STATE" \
  config       "/storage/emulated/0/PSP/SYSTEM" \
  roms_local   "/storage/emulated/0/PSP/GAME" \
  roms_remote  "roms/psp" \
  saves_remote "saves/ppsspp"


# ---- RetroArch (multi-system) — public IF you point it at a public dir -----
#  In RetroArch: Settings > Directory — set Saves and Save States to
#  /storage/emulated/0/RetroArch/... (defaults below assume you did this).
profile retroarch \
  label        "RetroArch (multi)" \
  root         0 \
  pkg          "com.retroarch" \
  saves        "/storage/emulated/0/RetroArch/saves:/storage/emulated/0/RetroArch/states" \
  config       "/storage/emulated/0/RetroArch/config" \
  roms_local   "/storage/emulated/0/RetroArch/roms" \
  roms_remote  "roms/retroarch" \
  saves_remote "saves/retroarch"


# ---- Dolphin (GameCube / Wii) — public IF user dir is set to a public path -
#  In Dolphin: Config > General > set the User Directory to
#  /storage/emulated/0/Dolphin (defaults below assume you did this).
#  If you left it default (Android/data/org.dolphinemu.dolphinemu), set root 1.
profile dolphin \
  label        "Dolphin (GC/Wii)" \
  root         0 \
  pkg          "org.dolphinemu.dolphinemu" \
  saves        "/storage/emulated/0/Dolphin/GC:/storage/emulated/0/Dolphin/Wii:/storage/emulated/0/Dolphin/StateSaves" \
  config       "/storage/emulated/0/Dolphin/Config" \
  roms_local   "/storage/emulated/0/Dolphin/Games" \
  roms_remote  "roms/gc-wii" \
  saves_remote "saves/dolphin"


# ---- Eden (Switch, Yuzu-fork) — NO ROOT NEEDED on recent builds ------------
#  Recent Eden (upstream PR #3154) has Settings > "Save Data Directory".
#  ONE-TIME on each device: update Eden to a build with that setting, set the
#  save directory to  /storage/emulated/0/EdenSaves  and accept the built-in
#  migration prompt. Eden then writes saves to .../EdenSaves/user/save which
#  this profile syncs without root.
#  (On OLD builds without that setting, saves are stuck in
#  Android/data/dev.eden.eden_emulator/files/nand/user/save — root only.)
profile eden \
  label        "Eden (Switch)" \
  root         0 \
  pkg          "dev.eden.eden_emulator" \
  saves        "/storage/emulated/0/EdenSaves/user/save" \
  roms_local   "/storage/emulated/0/EmulatorSync/roms/switch" \
  roms_remote  "roms/switch" \
  saves_remote "saves/eden"


# ---- Citra / Lime3DS (3DS) — Android/data, needs ROOT (or set public dir) --
profile citra \
  label        "Citra/Lime3DS (3DS)" \
  root         1 \
  pkg          "org.citra.citra_emu" \
  saves        "/data/data/org.citra.citra_emu/files/sdmc" \
  config       "/data/data/org.citra.citra_emu/files/config" \
  roms_local   "/storage/emulated/0/EmulatorSync/roms/3ds" \
  roms_remote  "roms/3ds" \
  saves_remote "saves/citra"


